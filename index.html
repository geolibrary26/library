const editNews=id=>{const n=S.news.find(x=>x.id==id)||{};modal(id?'Sửa tin':'Đăng tin',[['title','Tiêu đề *'],['type','Loại tin','sel',[[1,'Tin hoạt động'],[2,'Tin thư viện'],[4,'Tin sự kiện']]],['img','Link ảnh đại diện'],['sum','Mô tả ngắn'],['body','Nội dung (HTML)','t']],{type:1,...n},async v=>{if(!v.title)throw Error('Thiếu tiêu đề');v.type=+v.type;v.at=n.at||Date.now();id?await adb.ref('lib/news/'+id).update(v):await adb.ref('lib/news').push(v)})};
const editPage=s=>{const p=S.pages[s]||(DP[s]?{title:DP[s][0],body:DP[s][1]}:{});modal('Sửa trang',[['title','Tiêu đề'],['body','Nội dung (HTML)','t']],p,v=>adb.ref('lib/pages/'+s).set(v))};
const editCfg=()=>modal('Cài đặt thư viện',[['name','Tên'],['hours','Giờ mở cửa'],['addr','Địa chỉ'],['mail','Email'],['tel','Điện thoại'],['fb','Link Facebook']],C(),v=>adb.ref('lib/cfg').set(v));
const bTable=()=>{const q=fold(S.aq);return`<table><tr><th>Nhan đề</th><th>Danh mục</th><th>Khối</th><th>Đọc</th><th></th></tr>${S.books.filter(b=>!q||fold(b.title+' '+b.author).includes(q)).map(b=>`<tr><td><b>${E(b.title)}</b>${b.hidden?' <span class="tg" style="--c:#f59e0b">Ẩn</span>':''}<br><span class="mu">${E(b.author||'')}</span></td><td>${E(catOf(b).name)}</td><td>${E(b.grade||'')}</td><td>${b.reads||0}</td><td style="white-space:nowrap"><button class="btn s l" onclick="editBook('${b.id}')">Sửa</button> <button class="btn s r" onclick="delItem('books','${b.id}')">Xóa</button></td></tr>`).join('')}</table>`};
async function setTab(t){S.tab=t;route(1);try{if(t=='act')S.logs=Object.values((await adb.ref('libLogs').orderByChild('t').limitToLast(300).get()).val()||{}).sort((a,b)=>b.t-a.t);if(t=='req'){const v=(await adb.ref('libReq').get()).val()||{};S.reqs=[];for(const u in v)for(const k in v[u])S.reqs.push({u,k,...v[u][k]});S.reqs.sort((a,b)=>b.t-a.t)}}catch(e){toast('Lỗi: '+e.message)}route(1)}
async function setReq(u,k,st){try{await adb.ref('libReq/'+u+'/'+k+'/status').set(st);S.reqs.find(x=>x.u==u&&x.k==k).status=st;route(1)}catch(e){toast('Lỗi: '+e.message)}}
function admin(){if(!S.user)return`<div class="w c" style="max-width:440px;padding:90px 20px"><img src="mascot.png" width="100" style="border-radius:26px"><h1 style="margin:16px 0 6px">Quản trị GeoLibrary</h1><p class="mu">Dùng tài khoản Google đã được duyệt trong LMS.</p><button class="btn big" onclick="aauth.signInWithPopup(new firebase.auth.GoogleAuthProvider())">Tiếp tục với Google</button> <a class="btn l big" href="#/">Quay lại</a></div>`;
if(!S.staff)return`<div class="w c" style="max-width:480px;padding:90px 20px"><h1>Chưa có quyền</h1><p class="mu">Tài khoản <b>${E(S.user.email)}</b> chưa được duyệt hoặc đã hết hạn. Hãy nhờ superadmin duyệt trong LMS, mục Nhân sự.</p><button class="btn l" onclick="outAll()">Đăng xuất</button></div>`;
const tabs=[['dash','Tổng quan','chart'],['books','Tài liệu','book'],['cats','Danh mục','grid'],['news','Tin tức','file'],['pages','Trang nội dung','note'],['act','Hoạt động','clock'],['req','Đề nghị','mail'],['cfg','Cài đặt','layers']],B=S.books,tot=B.reduce((a,b)=>a+(b.reads||0),0),mx=Math.max(1,...S.cats.map(c=>cnt(c.id)));let m='';
const tw=h=>`<div class="tw">${h}</div>`;
if(S.tab=='dash')m=`<h1>Tổng quan</h1><div class="st"><div class="cd"><b>${B.length}</b>Tài liệu</div><div class="cd"><b>${S.cats.length}</b>Danh mục</div><div class="cd"><b>${tot}</b>Lượt đọc</div><div class="cd"><b>${S.stats.total||0}</b>Lượt truy cập</div></div><div class="row"><div class="cd"><h3 style="margin-bottom:10px">Tài liệu theo danh mục</h3>${S.cats.map(c=>`<div style="--c:${c.color}">${E(c.name)} <b>${cnt(c.id)}</b><div class="bar2"><i style="width:${cnt(c.id)/mx*100}%"></i></div></div>`).join('')}</div><div class="cd"><h3 style="margin-bottom:6px">Đọc nhiều nhất</h3>${rankList([...B].sort((a,b)=>(b.reads||0)-(a.reads||0)).slice(0,6))}</div></div>`;
if(S.tab=='books')m=`<div class="sh"><h1>Tài liệu</h1><button class="btn" onclick="editBook()">${I('plus',16)} Thêm</button></div><input class="inp" placeholder="Tìm tài liệu..." value="${E(S.aq)}" oninput="S.aq=this.value;$('#at').innerHTML=bTable()" style="margin-bottom:14px"><div class="tw" id="at">${bTable()}</div>`;
if(S.tab=='cats')m=`<div class="sh"><h1>Danh mục</h1><button class="btn" onclick="editCat()">${I('plus',16)} Thêm</button></div>${S.dbc?'':`<div class="cd" style="margin-bottom:14px">Đang dùng danh mục mẫu. <button class="btn s" onclick="seedCats()">Lưu danh mục mẫu vào hệ thống</button> để chỉnh sửa.</div>`}${tw(`<table><tr><th>Danh mục</th><th>Mô tả</th><th>Tài liệu</th><th></th></tr>${S.cats.map(c=>`<tr><td><span class="tg" style="--c:${c.color}">${I(c.icon,14)} ${E(c.name)}</span></td><td class="mu">${E(c.desc||'')}</td><td>${cnt(c.id)}</td><td style="white-space:nowrap">${S.dbc?`<button class="btn s l" onclick="editCat('${c.id}')">Sửa</button> <button class="btn s r" onclick="delItem('cats','${c.id}')">Xóa</button>`:''}</td></tr>`).join('')}</table>`)}`;
if(S.tab=='news')m=`<div class="sh"><h1>Tin tức</h1><button class="btn" onclick="editNews()">${I('plus',16)} Đăng</button></div>${tw(`<table><tr><th>Tiêu đề</th><th>Loại</th><th>Ngày</th><th></th></tr>${S.news.map(n=>`<tr><td>${E(n.title)}</td><td>${NT[n.type]}</td><td>${fd(n.at)}</td><td style="white-space:nowrap"><button class="btn s l" onclick="editNews('${n.id}')">Sửa</button> <button class="btn s r" onclick="delItem('news','${n.id}')">Xóa</button></td></tr>`).join('')}</table>`)}`;
if(S.tab=='pages')m=`<h1 style="margin-bottom:14px">Trang nội dung</h1>${tw(`<table>${Object.keys(DP).map(s=>`<tr><td><b>${E((S.pages[s]||{title:DP[s][0]}).title)}</b><br><span class="mu">#/p/${s}</span></td><td><button class="btn s l" onclick="editPage('${s}')">Sửa</button></td></tr>`).join('')}</table>`)}`;
if(S.tab=='act'){const c={};S.logs.forEach(l=>c[l.n||'?']=(c[l.n||'?']||0)+1);m=`<h1 style="margin-bottom:14px">Hoạt động đọc</h1><div class="row"><div>${tw(`<table><tr><th>Giờ</th><th>Học sinh</th><th>Tài liệu</th><th>Thời gian</th></tr>${S.logs.map(l=>`<tr><td>${new Date(l.t).toLocaleString('vi-VN')}</td><td>${E(l.n)}</td><td>${E(l.bt||l.ev)}</td><td>${l.dur?Math.ceil(l.dur/60)+' phút':'—'}</td></tr>`).join('')}</table>`)}</div><div class="cd"><h3 style="margin-bottom:8px">Đọc nhiều (300 lượt gần nhất)</h3>${Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>`<p style="margin:4px 0">${E(x[0])} · <b>${x[1]}</b></p>`).join('')||'Chưa có'}</div></div>`}
if(S.tab=='req')m=`<h1 style="margin-bottom:14px">Đề nghị tài liệu</h1>${tw(`<table><tr><th>Tài liệu</th><th>Học sinh</th><th>Ngày</th><th>Trạng thái</th></tr>${S.reqs.map(r=>`<tr><td><b>${E(r.title)}</b><br><span class="mu">${E(r.author||'')} ${E(r.note||'')}</span></td><td>${E(r.n)}</td><td>${fd(r.t)}</td><td><div class="chips">${Object.entries(RS).map(([k,v])=>`<button class="btn s ${(r.status||'new')==k?'':'l'}" onclick="setReq('${r.u}','${r.k}','${k}')">${v[0]}</button>`).join('')}</div></td></tr>`).join('')||'<tr><td colspan=4 class="mu">Chưa có đề nghị.</td></tr>'}</table>`)}`;
if(S.tab=='cfg')m=`<h1>Cài đặt</h1><p><button class="btn" onclick="editCfg()">Sửa thông tin thư viện</button></p><p class="mu">Duyệt nhân sự: LMS, mục Nhân sự (dùng chung tài khoản).</p>`;
return`<div class="ad"><aside><a class="brand" href="#/" style="margin-bottom:14px;color:#fff"><img src="mascot.png"><span><b style="color:#fff">${E(C().name)}</b></span></a>${tabs.map(t=>`<a class="t ${S.tab==t[0]?'on':''}" onclick="setTab('${t[0]}')">${I(t[2],18)} ${t[1]}</a>`).join('')}<a class="t gap" href="#/" style="margin-top:14px">${I('home',18)} Xem website</a><a class="t" onclick="outAll()">${I('out',18)} Đăng xuất</a></aside><main>${m}</main></div>`}
/* ---------- đăng nhập học sinh (tài khoản app) ---------- */
const digits=s=>String(s||'').replace(/\D/g,'').replace(/^84/,'0');let busy=false,ev=0;
async function stuCheck(u){if((await db.ref('locks/'+u.uid).get()).val()){await auth.signOut();throw Error('Tài khoản đang bị khóa. Em liên hệ trợ giảng để được mở lại.')}
const a=(await db.ref('accts/'+u.uid).get()).val();if(!a||!a.sids){await auth.signOut();throw Error('Tài khoản chưa liên kết học sinh. Em hãy đăng nhập lần đầu trong app học sinh.')}
const sids=await Promise.all(Object.keys(a.sids).map(async id=>({id,name:(await db.ref('roster/'+id+'/name').get()).val()||id})));let sid=null;try{sid=localStorage.gl_lsid}catch(e){}if(!sids.some(x=>x.id==sid))sid=sids[0].id;return{uid:u.uid,phone:a.p||'',sids,sid}}
async function stuLogin(f){const p=digits(f.p.value),w=f.w.value;S.err='';busy=true;try{const ix=(await db.ref('phoneIdx/'+p).get()).val();if(!ix)throw Error('SĐT này chưa tạo mật khẩu. Em hãy đăng nhập lần đầu trong app học sinh.');const c=await auth.signInWithEmailAndPassword(ix.em,w);S.stu=await stuCheck(c.user);busy=false;afterAuth()}catch(e){busy=false;S.err=({'auth/invalid-credential':'SĐT hoặc mật khẩu chưa đúng.','auth/wrong-password':'Mật khẩu chưa đúng.','auth/too-many-requests':'Em nhập sai nhiều lần, thử lại sau ít phút.'})[e.code]||e.message;route(1)}return false}
function loginView(){return`<section class="hero" style="min-height:100vh;display:grid;align-items:center"><div class="w" style="max-width:940px"><div><img src="mascot.png" width="92" style="border-radius:26px;animation:fl 6s ease-in-out infinite"><h1 style="margin:16px 0 8px">Geo<span>Library</span></h1><p>Thư viện số Chuyên Địa lí cô Hải Hà. Đăng nhập bằng tài khoản <b>app học sinh</b> (SĐT và mật khẩu) để tra cứu, đọc online và ghi chú.</p></div><form class="cd fm" style="color:var(--tx)" onsubmit="return stuLogin(this)">${S.err?`<div style="color:var(--dg);font-weight:700">${E(S.err)}</div>`:''}<div><label>Số điện thoại</label><input class="inp" name="p" inputmode="tel" autocomplete="username" required></div><div><label>Mật khẩu</label><input class="inp" name="w" type="password" autocomplete="current-password" required></div><button class="btn big">Đăng nhập</button>${APP_URL?`<a href="${APP_URL}">Chưa có mật khẩu? Đăng nhập lần đầu ở app</a>`:'<span class="mu" style="font-size:13px">Chưa có mật khẩu? Hãy đăng nhập lần đầu ở app học sinh.</span>'}<a href="#/admin" style="font-size:13px">Giáo viên / trợ giảng</a></form></div></section>`}
function outAll(){auth.signOut();aauth.signOut();location.hash='#/'}
function afterAuth(){ev++;if(ev<2)return;S.ready=false;load();hit()}
/* ---------- router ---------- */
let lastH='';
function route(force){if(!S.ready){$('#app').innerHTML='<div class="c" style="padding:120px 20px"><img src="mascot.png" width="84" style="border-radius:22px;animation:fl 3s infinite"><p class="mu">Đang tải GeoLibrary...</p></div>';return}
const ae=document.activeElement;if(!force&&ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&$('#app').contains(ae))return;
const h=location.hash.slice(2),[p,q]=h.split('?'),P=new URLSearchParams(q||''),sg=p.split('/');let v;
if(!S.stu&&!S.staff&&sg[0]!='admin')v=loginView();else switch(sg[0]){case'me':v=shelf();break;case'notes':v=notesPage();break;case'request':v=reqPage();break;case'cats':v=catsPage();break;case'cat':v=catPage(sg[1],P);break;case'search':v=results(P);break;case'adv':v=adv();break;case'new':v=newMat(P);break;case'top':v=topPg(P);break;case'book':v=book(sg[1]);break;case'news':v=newsList(P);break;case'n':v=newsOne(sg[1]);break;case'p':v=pageView(sg[1]);break;case'admin':v=admin();break;default:v=home()}
$('#app').innerHTML=v;if(location.hash!=lastH){window.scrollTo(0,0);lastH=location.hash;S.bt='info'}}
addEventListener('hashchange',()=>route(1));
auth.onAuthStateChanged(async u=>{if(busy)return;S.stu=null;if(u){try{S.stu=await stuCheck(u)}catch(e){S.err=e.message}}afterAuth()});
aauth.onAuthStateChanged(async u=>{S.user=u;S.staff=false;if(u){try{const p=(await adb.ref('users/'+u.uid).get()).val();S.staff=!!p&&p.status==='active'&&(!p.expiresAt||p.expiresAt>Date.now())}catch(e){}}afterAuth()});
route();
</script></body></html>
