 const stc={ok:'ok',part:'pt',no:'no',blank:'bl',pend:'pd'},pal=fl.map(x=>`<button class="xpc ${stc[x.st]} ${cur&&x.i==cur.i?'cur':''}" onclick="xrSet('sel',${x.i})">${x.i+1}${fls.includes(x.i)?'<u></u>':''}</button>`).join('');

 const L='ABCDEF',showL=!e.so,tg=(t,c)=>`<em class="xtg ${c||''}">${t}</em>`;
 let right;
 if(rv=='none')right='<div class="xq2 xsc"><div style="font-size:44px">📊</div><h2 style="margin:8px 0">Giáo viên chỉ công bố điểm tổng</h2><div class="mu">Chi tiết từng câu không được hiển thị cho bài này.</div></div>';
 else if(!cur)right=`<div class="xq2 xsc"><div style="font-size:44px">${it.every(x=>x.st=='ok')?'🎉':'🔎'}</div><h2 style="margin:8px 0">${rv=='wrong'&&it.every(x=>x.st=='ok')?'Em làm đúng tất cả!':'Không có câu nào trong bộ lọc này'}</h2></div>`;
 else{const{q,i,v,st,got}=cur,a=K['q'+i],opts=xarr(q.o);let b='';

  else if(q.t=='short'){b=`<div class="xo2 ${canAns?(st=='ok'?'ok':'no'):'me'}"><span>Bài làm: <b>${xHas(v)?E(v):'<i>Chưa trả lời</i>'}</b></span></div>${canAns?`<div class="xo2 ok"><span>Đáp án chấp nhận: <b>${E(String(a||'').replace(/\|/g,' / '))}</b></span></div>`:''}`}

 return shell(`<div class="xw xwide">${head}<div class="xrz">${left}<section>${right}</section></div>${back}</div>`,'x')}
